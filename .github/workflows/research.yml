name: Research and deploy
on:
  push:
    branches: [main]
    paths-ignore: ['public/data/**', 'docs/**', 'README.md']
  schedule:
    - cron: '20 8 * * *'
      timezone: Asia/Shanghai
    - cron: '25 17 * * 1-5'
      timezone: Asia/Shanghai
    - cron: '30 20 * * 0'
      timezone: Asia/Shanghai
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: game-alpha-production
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Backend tests
        run: python -m pytest -q
      - name: Collect and validate real research data
        env:
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_BASE_URL: ${{ vars.AGNES_BASE_URL || 'https://apihub.agnes-ai.com/v1' }}
          AGNES_MODEL: ${{ vars.AGNES_MODEL || 'agnes-3.0-flash' }}
        run: python -m pipeline.run
      - name: Validate persisted snapshot
        run: python -m pipeline.run --validate-only
      - name: Frontend unit tests
        run: npm test
      - name: Frontend check and build
        run: npm run build
      - name: Record successful build
        run: PYTHONPATH=. python scripts/record_build.py
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 7
      - name: Save verified research history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh verified research [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: research
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy official GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
